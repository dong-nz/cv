<!doctype html>
<html lang="en">
  <head>
    <!-- The site identity values in this head are filled at build time by the
         site-identity vite plugin; they come from the CI variables SITE_URL /
         SITE_NAME or the local .env, never from this file. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_NAME%</title>
    <meta
      name="description"
      content="Portfolio of Nguyễn Đông, a Senior Software Engineer in Ho Chi Minh City working on distributed systems, logistics automation, computer vision and practical AI in Java, Go and TypeScript."
    />
    <meta name="author" content="Nguyễn Đông" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#151914" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_NAME%" />
    <meta
      property="og:description"
      content="Distributed systems, logistics automation, computer vision and practical AI — SAP Lab Vietnam, Lazada, and a logistics digital-twin platform."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="vi_VN" />
    <meta property="og:image" content="%SITE_URL%/profile-photo.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="Portrait of Nguyễn Đông" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_NAME%" />
    <meta
      name="twitter:description"
      content="Distributed systems, logistics automation, computer vision and practical AI — SAP Lab Vietnam, Lazada, and a logistics digital-twin platform."
    />
    <meta name="twitter:image" content="%SITE_URL%/profile-photo.webp" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nguyễn Đông",
        "alternateName": "Dong Nguyen",
        "jobTitle": "Senior Software Engineer",
        "url": "%SITE_URL%/",
        "email": "mailto:nguyendong_bkdn@yahoo.com",
        "image": "%SITE_URL%/profile-photo.webp",
        "sameAs": [
          "https://github.com/dong-nz",
          "https://www.linkedin.com/in/dong-nz"
        ],
        "knowsAbout": [
          "Distributed systems",
          "System architecture",
          "Computer vision",
          "AI / ML applications"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ho Chi Minh City",
          "addressCountry": "VN"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          var storedPalette = localStorage.getItem('portfolio-palette')
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-palette', storedPalette === 'blue' ? 'blue' : 'red')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.setAttribute('data-palette', 'red')
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
