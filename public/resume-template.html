<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <title>Resume - Dong Nguyen</title>
  <style>
    /* Font faces — injected at build time */
    {{FONT_FACES}}

    /* Page layout */
    @page {
      size: A4;
      margin: 20mm 18mm 20mm 18mm;
    }

    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      font-size: 10pt;
      line-height: 1.5;
      color: #1a1a1a;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #1a1a1a;
      margin-bottom: 16px;
    }

    .header-photo {
      width: 75px;
      height: 95px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 18pt;
      font-weight: 700;
      color: #1a1a1a;
    }

    .header-info .title {
      font-size: 11pt;
      font-weight: 500;
      color: #4a4a4a;
      margin-bottom: 4px;
    }

    .header-info .contact {
      font-size: 9pt;
      color: #666;
      line-height: 1.6;
    }

    /* About me */
    .about-summary {
      font-size: 9.5pt;
      color: #4a4a4a;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 12pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5pt;
      color: #1a1a1a;
      padding-bottom: 4px;
      border-bottom: 1px solid #ccc;
      margin-bottom: 10px;
    }
    /* Experience */
    .exp-entry {
      margin-bottom: 12px;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 2px;
    }

    .exp-title {
      font-weight: 600;
      font-size: 11pt;
      color: #1a1a1a;
    }

    .exp-duration {
      font-size: 9pt;
      color: #666;
      white-space: nowrap;
    }

    .exp-company {
      font-size: 10pt;
      color: #4a4a4a;
      margin-bottom: 2px;
    }

    .exp-location {
      font-size: 9pt;
      color: #888;
      margin-bottom: 4px;
    }

    .exp-responsibilities {
      list-style: disc;
      padding-left: 16px;
      margin-bottom: 6px;
    }

    .exp-responsibilities li {
      font-size: 9.5pt;
      margin-bottom: 2px;
    }

    /* Achievement */
    .achievement {
      margin-left: 12px;
      margin-bottom: 8px;
    }

    .achievement-title {
      font-weight: 600;
      font-size: 10pt;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .achievement-context {
      font-size: 9pt;
      color: #4a4a4a;
      margin-bottom: 4px;
      font-style: italic;
    }

    .achievement-technical {
      list-style: disc;
      padding-left: 20px;
      margin-bottom: 4px;
    }

    .achievement-technical li {
      font-size: 9pt;
      color: #4a4a4a;
      margin-bottom: 1px;
    }

    .achievement-tech {
      font-size: 8.5pt;
      color: #666;
    }

    .achievement-tech span {
      display: inline-block;
      background: #f0f0f0;
      padding: 0 4px;
      border-radius: 2px;
      margin-right: 4px;
    }

    .achievement-impact {
      font-size: 9pt;
      color: #4a4a4a;
      margin-top: 2px;
    }

    .achievement-metrics {
      font-size: 9pt;
      color: #4a4a4a;
      margin-top: 1px;
    }

    /* Skills */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
    }

    .skill-group-title {
      font-weight: 600;
      font-size: 10pt;
      color: #1a1a1a;
      margin-bottom: 2px;
    }

    .skill-list {
      font-size: 9pt;
      color: #4a4a4a;
      line-height: 1.5;
    }

    /* Projects */
    .project {
      margin-bottom: 12px;
    }

    .project-title {
      font-weight: 600;
      font-size: 11pt;
      color: #1a1a1a;
    }

    .project-role {
      font-size: 9pt;
      color: #666;
      margin-bottom: 2px;
    }

    .project-summary {
      font-size: 9.5pt;
      color: #4a4a4a;
      margin-bottom: 4px;
    }

    .project-tech {
      font-size: 8.5pt;
      color: #666;
    }

    .project-tech span {
      display: inline-block;
      background: #f0f0f0;
      padding: 0 4px;
      border-radius: 2px;
      margin-right: 4px;
    }

    .project-metrics {
      font-size: 9pt;
      color: #4a4a4a;
      margin-top: 2px;
    }

    /* Version stamp footer */
    .pdf-footer {
      text-align: center;
      font-size: 8pt;
      color: #999;
      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img class="header-photo" src="data:image/webp;base64,{{PHOTO_BASE64}}" alt="Dong Nguyen" />
    <div class="header-info">
      <h1>{{NAME}}</h1>
      <div class="title">{{TITLE}}</div>
      <div class="contact">
        {{EMAIL}}<br>
        {{GITHUB}}<br>
        {{LINKEDIN}}
      </div>
    </div>
  </div>

  <!-- About me -->
  <div class="section">
    <div class="about-summary">{{BIO}}</div>
  </div>

  <!-- Experience -->
  <div class="section">
    <div class="section-title">{{EXPERIENCE_LABEL}}</div>
    {{EXPERIENCE}}
  </div>

  <!-- Projects -->
  <div class="section">
    <div class="section-title">{{PROJECTS_LABEL}}</div>
    {{PROJECTS}}
  </div>

  <!-- Skills -->
  <div class="section">
    <div class="section-title">{{SKILLS_LABEL}}</div>
    <div class="skills-grid">
      {{SKILLS}}
    </div>
  </div>

  <!-- Version stamp footer -->
  <div class="pdf-footer">
    Last updated: {{UPDATED_DATE}}
  </div>
</body>
</html>
