<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="cv-title cv-desc">
  <title id="cv-title">CV document icon</title>
  <desc id="cv-desc">A resume page with a folded corner, a left-edge dash, and CV lettering, drawn in the site's 2px line language so it inherits the current text colour.</desc>
  <!-- Page outline top/left part, ending above the dash gap -->
  <path d="M14 2 H6 a2 2 0 0 0 -2 2 V6"/>
  <!-- Dash on the left edge; 4px gaps keep it visible under 2px round caps -->
  <path d="M4 10 V12"/>
  <!-- Page outline lower/left/bottom/right part, ending at the top-right cut point -->
  <path d="M4 16 v4 a2 2 0 0 0 2 2 h12 a2 2 0 0 0 2 -2 V8 L14 2"/>
  <!-- Folded corner -->
  <path d="M14 2 v4 a2 2 0 0 0 2 2 h4"/>
  <!-- CV lettering: open arc C + stroked V, both 6px tall, centred on the page -->
  <path d="M9.5 12 A3 3 0 0 0 9.5 18"/>
  <path d="M12.5 12 L15 18 L17.5 12"/>
</svg>
