# Repo-as-source-of-truth copy (spec-v4-deploy-infra D7/D9): rsynced to the
# stack directory and run there by the pipeline or Dockge. Runtime values live
# in secrets/site_config, which is NOT in the repository — the repo carries no
# site identity (D10-D13).
services:
  dong-site:
    image: nginx:alpine
    container_name: dong-site
    restart: unless-stopped
    # Source the config file, then hand over to the image's official entrypoint.
    # set -a is REQUIRED: a sourced assignment is a shell variable, not an env var —
    # without export the entrypoint child (and its envsubst step) sees nothing and
    # the template renders unsubstituted (reproduced locally 2026-10-23: unknown
    # "gitea_contents_api" variable). The nginx command is inline: a compose
    # entrypoint override does NOT keep the image's CMD (CMD=[]) — an empty "$@"
    # makes the exec a no-op, exit 0, restart loop.
    entrypoint: ["sh", "-c", "set -a; . /run/secrets/site_config; exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    environment:
      # Names the variables the template renderer substitutes. The filter is a
      # REGEX the official entrypoint matches against each variable name
      # (`t ~ /^(filter)$/`) — alternatives MUST be separated with |, a comma
      # matches nothing and leaves ${…} in the rendered config (nginx -t then
      # fails: unknown "gitea_contents_api" variable — reproduced 2026-10-23).
      # $uri/$host stay nginx runtime variables. The filter is not sensitive.
      NGINX_ENVSUBST_FILTER: GITEA_TOKEN|GITEA_CONTENTS_API
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      # Mounted as a template: the image's envsubst step renders it to
      # /etc/nginx/conf.d/default.conf with the variables sourced above.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/htpasswd:/etc/nginx/htpasswd:ro
    secrets:
      - site_config
    networks:
      - docker-network

secrets:
  site_config:
    file: ./secrets/site_config

networks:
  docker-network:
    external: true
