name: Deploy Static Site

on:
  push:
    branches:
      - master

jobs:
  build and deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          version: ^12.0.0
          runtime: node@24
      - run: node --version
      - run: pnpm build
      - name: List files in dist
        run: |
          ls ${{ gitea.workspace }}/dist
      - name: rsync deployments
        uses: burnett01/rsync-deployments@v9
        with:
          debug: true
          switches: -avzr --delete
          path: dist/
          remote_path: /opt/stacks/dong-site/dist/ # ex: /var/www/html/
          remote_host: ${{ secrets.DEPLOY_HOST }} # ex: example.com
          remote_port: ${{ secrets.DEPLOY_SSH_PORT }} # ex: 22
          remote_user: ${{ secrets.DEPLOY_USER }} # ex: ubuntu
          remote_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}