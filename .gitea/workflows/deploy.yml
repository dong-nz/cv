name: Deploy Static Site

on:
  push:
    branches:
      - master

jobs:
  build and deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          version: ^12.0.0
          runtime: node@24
      - run: node --version
      - run: pnpm build
      - name: List files in the repository
        run: |
          ls ${{ gitea.workspace }}
          ls ${{ gitea.workspace/dist }}
      - run: echo "🍏 This job's status is ${{ job.status }}."