name: Deploy Static Site

on:
  push:
    branches:
      - master


concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Site identity (spec-v4-deploy-infra D10/D12): the build and the resume
    # generator derive every published URL and the page title from these two
    # values; the build fails loudly when either is missing.
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_NAME: ${{ vars.SITE_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          version: ^12.0.0
          runtime: node@24
      - run: pnpm tsx scripts/validate-content.ts
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: dist/
          retention-days: 5

  generate-resume:
    runs-on: ubuntu-latest
    needs: build
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_NAME: ${{ vars.SITE_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          version: ^12.0.0
          runtime: node@24

      # Cache Playwright browser — download once, reuse
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium

      # Generate English version (default)
      - run: pnpm tsx scripts/generate-resume.ts --lang=en

      # Generate Vietnamese version
      - run: pnpm tsx scripts/generate-resume.ts --lang=vi

      # Upload both PDF artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: resume-pdf-en
          path: dist/resume.pdf
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: resume-pdf-vi
          path: dist/resume-vi.pdf
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [build, generate-resume]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: resume-pdf-en
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: resume-pdf-vi
          path: dist/

      - name: rsync deployments
        uses: burnett01/rsync-deployments@v9
        with:
          debug: true
          switches: -avzr --delete
          path: dist/
          remote_path: /opt/stacks/dong-site/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_port: ${{ secrets.DEPLOY_SSH_PORT }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
