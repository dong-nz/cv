services:
  dong-site:
    image: nginx:alpine
    container_name: dong-site
    restart: unless-stopped
    environment:
      # The write token for the /api/content/ proxy (spec-v4 §6.2). Set it in
      # the local .env; NGINX_ENVSUBST_FILTER restricts the template
      # substitution to this variable only, so $uri/$host stay nginx runtime
      # variables.
      GITEA_TOKEN: ${GITEA_TOKEN}
      NGINX_ENVSUBST_FILTER: GITEA_TOKEN
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      # Mounted as a template: the image's envsubst step renders it to
      # /etc/nginx/conf.d/default.conf with GITEA_TOKEN filled in.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/htpasswd:/etc/nginx/htpasswd:ro
    networks:
      - docker-network
networks:
  docker-network:
    external: true